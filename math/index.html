<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#e9eef6">
  <title>the math rooms</title>
  <link rel="icon" href="../apple-touch-icon.png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=IBM+Plex+Mono:wght@400;500&family=Nunito:wght@400;600;700&family=Quicksand:wght@500;600&family=Shippori+Mincho:wght@500;600&family=VT323&display=swap">
  <link rel="stylesheet" href="../css/hub.css">
  <link rel="stylesheet" href="dojo.css">
  <script src="../js/aria-core.js"></script>
</head>
<body class="dojo" data-page="the math rooms">
  <header class="topbar">
    <a class="icon-btn" href="../index.html" id="back" data-site-link>← back</a>
    <div class="brand"><span class="logo" id="gTitle">the math rooms</span><span class="sub" id="gSkill"></span></div>
    <div class="progress" id="prog" aria-label="Progress"></div>
    <span class="xp-live" id="xpLive">+0 xp</span>
  </header>
  <main class="shell" id="app"></main>
  <div class="overlay" id="stuck" hidden><div class="sheet stuck-sheet" role="dialog" aria-modal="true" aria-labelledby="stuckH">
    <h2 id="stuckH">where am i stuck?</h2>
    <p class="lead">Pick the sentence that fits. Saying exactly where you're stuck is a real skill, and the same sentences work with your teacher in class.</p>
    <div class="phrases">
      <button type="button" data-k="here"><b>"I understand up to here, but not this step."</b><span>Get a hint for just this step.</span></button>
      <button type="button" data-k="start"><b>"I don't know how to start."</b><span>Get the first move.</span></button>
      <button type="button" data-k="example"><b>"Can you show me an example?"</b><span>See one like it with different numbers.</span></button>
      <button type="button" data-k="check"><b>"I have an answer, but I'm not sure it's right."</b><span>Get a way to check it yourself.</span></button>
    </div>
    <div class="sheet-foot"><span></span><button type="button" class="btn ghost" id="stuckClose">never mind</button></div>
  </div></div>
  <script src="../settings.js"></script>
  <script src="../story/chapters.js"></script>
  <script src="engine.js"></script>
  <script src="../js/aria-fx.js"></script>
  <script src="dojo.js"></script>
</body>
</html>
